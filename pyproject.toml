[project]
name = "solaredge-monitoring-ha"
version = "0.1.0"
description = "Home Assistant-integratie voor de interne API van monitoring.solaredge.com"
requires-python = ">=3.13"
license = "MIT"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["live: echte requests naar de SolarEdge API (SOLAREDGE_LIVE_TESTS=1)"]

[tool.ruff]
line-length = 130
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ASYNC", "PL"]
ignore = ["PLR0911", "PLR0913", "PLR0917", "PLR2004", "PLR0912", "PLR0915", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components"]
