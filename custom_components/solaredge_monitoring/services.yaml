import_statistics:
  fields:
    device_id:
      required: true
      selector:
        device:
          filter:
            integration: solaredge_monitoring
    entity_id:
      required: false
      selector:
        entity:
          multiple: true
          filter:
            integration: solaredge_monitoring
            domain: sensor
    start:
      required: false
      selector:
        date:
    end:
      required: false
      selector:
        date:
    interval:
      required: false
      default: hour
      selector:
        select:
          translation_key: interval
          options:
            - max
            - five_minutes
            - hour
            - day
