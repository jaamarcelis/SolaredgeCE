import_energy_history:
  fields:
    device_id:
      required: true
      selector:
        device:
          filter:
            integration: solaredge_monitoring
    start:
      required: true
      selector:
        date:
    end:
      required: false
      selector:
        date:
    interval:
      required: false
      default: hour
      selector:
        select:
          translation_key: interval
          options:
            - five_minutes
            - hour
            - day
